{% extends "base.html" %}

{% block extrahead %}
  <meta name="theme-color" content="#0e1437">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{% if page.title and not page.is_homepage %}{{ page.title }} - {% endif %}{{ config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social.png">
  <meta name="twitter:card" content="summary_large_image">
  {# Without JavaScript nothing tells the menu that the page has scrolled, so it keeps its background. #}
  <noscript><style>.md-header::before { opacity: 1 !important; }</style></noscript>
{% endblock %}
