[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inro"
dynamic = ["version"]
description = "A unified PyTorch framework for implicit neural representations, with FUTON, the Fourier Tensor Network"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Pooya Ashtari", email = "pooya.ash@gmail.com"},
]
keywords = ["implicit neural representations", "INR", "tensor networks", "pytorch", "deep learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "torchmetrics>=1.8.2",
    "numpy>=1.26.4",
    "Pillow>=12.1.1",
    "matplotlib>=3.10.8",
    "tqdm>=4.67.3",
    "scipy>=1.17.1",
    "pandas>=3.0.1",
    "seaborn>=0.13.2",
    "kornia>=0.8.2",
    "opt-einsum>=3.4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
3d = [
    "PyMCubes>=0.1.6",
    "pycollada>=0.9",  # mcubes.export_mesh writes COLLADA through it
    "trimesh>=4.12.2",  # reads the meshes
    "open3d>=0.19.0",
]
nerf = [
    "nerfacc>=0.5.2",  # CUDA occupancy-grid sampling (pure-PyTorch fallback built in)
    "imageio>=2.34",   # novel-view video export
]
dev = [
    "black>=26.1",
    "pyinstrument>=5.1.2",
    "pytest>=7.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-glightbox>=0.4",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/pashtari/inro"
Documentation = "https://pashtari.github.io/inro/"
Repository = "https://github.com/pashtari/inro"
Paper = "https://arxiv.org/abs/2602.13414"
Issues = "https://github.com/pashtari/inro/issues"

[tool.setuptools.dynamic]
version = {attr = "inro.__version__"}

[tool.setuptools.packages.find]
include = ["inro*"]

[tool.black]
line-length = 88
target-version = ["py311"]
