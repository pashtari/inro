site_name: Inro
site_description: A unified PyTorch framework for implicit neural representations, with FUTON, the Fourier Tensor Network.
site_url: https://pashtari.github.io/inro/
repo_url: https://github.com/pashtari/inro
repo_name: pashtari/inro
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Pooya Ashtari. MIT License.
exclude_docs: |
  _ext/
  _overrides/

theme:
  name: material
  custom_dir: docs/_overrides
  language: en
  logo: assets/wordmark-dark.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Quicksand
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/pashtari/inro
      name: Inro on GitHub
    - icon: fontawesome/solid/file-lines
      link: https://arxiv.org/abs/2602.13414
      name: The FUTON paper on arXiv

extra_css:
  - https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=fallback
  - stylesheets/extra.css

extra_javascript:
  - javascripts/inro.js
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - autorefs
  - glightbox:
      auto_caption: false
      skip_classes:
        - skip-lightbox
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_options:
              returns_multiple_items: false
              returns_named_value: false
              trim_doctest_flags: true
            docstring_section_style: list
            extensions:
              - docs/_ext/griffe_rst_roles.py:RSTRoles
            show_bases: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            line_length: 80
            merge_init_into_class: true
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: false
            heading_level: 2

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Your first INR: getting-started/quickstart.md
  - Concepts:
      - concepts/index.md
      - INRs in Inro: concepts/inrs.md
      - FUTON: concepts/futon.md
      - Error bound of FUTON: concepts/error-bound.md
      - The model zoo: concepts/models.md
      - Conventions: concepts/conventions.md
  - Tutorials:
      - tutorials/index.md
      - Fitting an image: tutorials/image.md
      - Occupancy volumes: tutorials/occupancy.md
      - Radiance fields: tutorials/nerf.md
      - Notebooks: tutorials/notebooks.md
  - Experiments:
      - experiments/index.md
      - Benchmarks: experiments/benchmarks.md
      - Ablations: experiments/ablations.md
      - Reproducing the paper: experiments/reproduce.md
  - API reference:
      - api/index.md
      - inro.models: api/models.md
      - FUTON, bases and combiners: api/futon.md
      - Datasets: api/datasets.md
      - Training and evaluation: api/training.md
      - Metrics and losses: api/metrics.md
      - Quantization: api/quantization.md
      - Compression: api/compression.md
      - Radiance fields: api/nerf.md
      - Utilities: api/utils.md
      - Custom components: api/custom-components.md
  - Troubleshooting: troubleshooting.md
