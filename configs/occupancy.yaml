# Occupancy volume representation: fit each model to one Stanford shape.
#
# Each model gives an inro class, its constructor arguments, and training
# arguments that override the shared ones. "deviation" marks a departure from
# the authors' published settings. Every learning rate is the best of the grid
# {1e-4, 3e-4, ..., 3e-1} on two shapes, passing over a rate that leaves some
# shape empty, and every model trains with PyTorch's default Adam.
#
# Every model has about 131k parameters: each baseline is the smallest of its
# kind that reaches 131,329, and FUTON, with K_c = L_c / 2 components on each
# axis c of the cropped voxel grid, L_c voxels long, and a linear head, takes
# the largest CP rank, a multiple of 5, that keeps it smaller than every
# baseline (TensoRF-CP, 131,585): 215 to 310 by shape (128,786 to 131,441).
# Its components and head were chosen in a sweep of both on the five shapes
# at 256 voxels per unit length: the best IoU there, tied with the 256-wide
# MLP, in a seventh of its training time; at 512, kappa = 1/2 still beats 1/4
# on Lucy.

data:
  resolution: 512  # voxels per unit length, about WIRE's 512^3 cube
  subsample: 1.0
  max_samples: 1048576  # 2^20 random voxels per step, for every shape

train:
  num_steps: 1000
  log_interval: 50
  eval_interval: 50
  chunk_size: 1048576  # voxels per evaluation forward pass, as many as per step
  seed: 0

models:
  RFF:  # Tancik et al. (NeurIPS 2020), 3D occupancy
    class: RFF
    kwargs:
      hidden_features: 188
      hidden_layers: 2
      num_frequencies: 256
      sigma: 6.0  # sigma 12 on [0, 1] coordinates equals 6 on [-1, 1]
      output_activation: tanh
    train: {lr: 3.0e-3}

  PE-MLP:  # FINER benchmark architecture
    class: PEMLP
    kwargs:
      hidden_features: 241  # 256 would add 13%
      hidden_layers: 3
      num_frequencies: 10
      output_activation: tanh
    train: {lr: 1.0e-3}  # 3e-3 leaves lucy empty

  MFN:  # GaborNet (Fathony et al., ICLR 2021) defaults
    class: MFN
    kwargs:
      hidden_features: 256
      hidden_layers: 3
      input_scale: 256.0
      alpha: 6.0
      beta: 1.0
      weight_scale: 1.0
      output_activation: tanh
    train: {lr: 3.0e-2}

  SIREN:  # FINER benchmark
    class: SIREN
    kwargs:
      hidden_features: 256
      hidden_layers: 3
      omega: 30.0
      output_activation: tanh
    train: {lr: 1.0e-3}

  FreSh:  # Kania et al. (ICLR 2025): the SIREN above, its first omega chosen per shape
    class: SIREN
    # our adaptation: 32 shells of the grid's 3D spectrum, as for SIREN radiance
    # fields, since the shells stop at half the smallest side of the volume
    fresh: {size: 32}
    kwargs:
      hidden_features: 256
      hidden_layers: 3
      omega: 30.0  # the later layers; FreSh picks the first one's
      output_activation: tanh
    train: {lr: 3.0e-3}

  Gauss:  # FINER benchmark
    class: Gauss
    kwargs:
      hidden_features: 256
      hidden_layers: 3
      scale: 30.0
      output_activation: tanh
    train: {lr: 3.0e-3}  # deviation: 1e-4 and 5e-3 in the references

  WIRE:  # WIRE occupancy script, real Gabor layer
    class: RealWIRE
    kwargs:
      hidden_features: 256
      hidden_layers: 3
      omega: 10.0
      scale: 40.0
      output_activation: tanh
    train: {lr: 3.0e-3}  # deviation: the official 5e-3 diverges for the real Gabor layer

  FINER:  # FINER benchmark
    class: FINER
    kwargs:
      hidden_features: 256
      hidden_layers: 3
      omega: 30.0
      output_activation: tanh
    train: {lr: 3.0e-3}

  Instant-NGP:  # instant-ngp configs/volume/base.json architecture
    class: InstantNGP
    kwargs:
      num_levels: 16
      features_per_level: 2
      log2_hashmap_size: 12
      base_resolution: 16
      max_resolution: 512  # the grid resolution
      hidden_features: 32  # deviation: 64 in the reference; the hash tables fill the budget
      hidden_layers: 2
      output_activation: tanh
    # deviation: 1e-4 in the reference, for longer training; 3e-2 leaves lucy empty
    train: {lr: 1.0e-2}

  TensoRF-CP:
    class: TensoRF
    kwargs:
      rank: 69  # the budget, with lines as long as the grid
      resolution: 512
      mode: cp
      hidden_features: 128
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 1.0e-2}

  TensoRF-VM:
    class: TensoRF
    kwargs:
      # a VM plane costs resolution^2 parameters per rank, so resolution beats
      # rank at this size
      rank: 4
      resolution: 97
      mode: vm
      hidden_features: 128
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 1.0e-2}  # 3e-2 leaves lucy empty

  GA-Planes:
    class: GAPlanes
    kwargs:
      features: 25
      resolution: [128, 32, 8]
      hidden_features: 128
      hidden_layers: 2
      output_activation: tanh
    train: {lr: 3.0e-2}

  F-INR:  # Vemuri et al. (WACV 2026): SIREN axes and CP
    class: FINR
    kwargs:
      rank: 259
      hidden_features: 96  # deviation: tuned; 256 in its paper, 128 in its public SDF config
      hidden_layers: 3
      mode: cp
      output_activation: tanh
    train: {lr: 1.0e-3}

  FUTON:
    class: FUTON
    budget: 131584  # parameters; "budget" below is the largest rank within it
    kwargs:
      # half the cropped voxel grid along each axis
      basis: [cosine, {num_components: [D // 2, H // 2, W // 2], grid_size: [D, H, W]}]
      combiner: [cp, {rank: budget}]
      head: linear
      output_activation: tanh
    train: {lr: 3.0e-2}
